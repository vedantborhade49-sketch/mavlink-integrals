# aerosar_tf configuration
# Defines intended Coordinate Frames and static transforms
# These mounting transforms MUST be updated based on the actual physical hardware.

frames:
  global_frame: "map"
  odometry_frame: "odom"
  base_frame: "base_link"
  
static_transforms:
  # base_link to camera_link
  camera:
    parent: "base_link"
    child: "camera_link"
    # Placeholder: Assuming forward-facing camera 10cm ahead, 5cm up
    translation: [0.1, 0.0, 0.05]
    # Placeholder: Roll, Pitch, Yaw
    rotation_rpy: [0.0, 0.0, 0.0] 
    
  # base_link to lidar_link
  lidar:
    parent: "base_link"
    child: "lidar_link"
    # Placeholder: Assuming top-mounted lidar 10cm up
    translation: [0.0, 0.0, 0.10]
    rotation_rpy: [0.0, 0.0, 0.0]

  # base_link to imu_link
  imu:
    parent: "base_link"
    child: "imu_link"
    # Assuming IMU is at the center of mass (flight controller)
    translation: [0.0, 0.0, 0.0]
    rotation_rpy: [0.0, 0.0, 0.0]
